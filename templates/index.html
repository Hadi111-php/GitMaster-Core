<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitMaster Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #bb86fc; margin: 0; }
        .tabs { display: flex; border-bottom: 2px solid #333; margin-bottom: 20px; }
        .tab { padding: 10px 20px; cursor: pointer; background: #1e1e1e; border-radius: 8px 8px 0 0; margin-right: 5px; border: 1px solid #333; border-bottom: none; color: #888; }
        .tab.active { background: #bb86fc; color: #121212; font-weight: bold; border-color: #bb86fc; }
        .content { display: none; background: #1e1e1e; padding: 20px; border-radius: 0 0 8px 8px; border: 1px solid #333; }
        .content.active { display: block; }
        button { background: #03dac6; color: #121212; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-family: inherit; font-weight: bold; margin: 5px 0; transition: 0.3s; }
        button:hover { background: #018786; color: white; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #444; background: #2c2c2c; color: white; font-family: inherit; box-sizing: border-box;}
        .alert { padding: 10px; margin-top: 10px; border-radius: 5px; background: #333; border-right: 4px solid #03dac6; }
        .alert.err { border-right-color: #cf6679; }
        .folder-list { max-height: 300px; overflow-y: auto; background: #2c2c2c; border-radius: 5px; padding: 10px; }
        .folder-item { padding: 8px; border-bottom: 1px solid #444; cursor: pointer; }
        .folder-item:hover { background: #3c3c3c; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h1>🚀 GitMaster Dashboard</h1><p>مدیریت یکپارچه پروژه‌ها</p></div>
        <div class="tabs">
            <div class="tab active" onclick="openTab('github', this)">🌐 گیت‌هاب</div>
            <div class="tab" onclick="openTab('local', this)">📂 پروژه‌های محلی</div>
            <div class="tab" onclick="openTab('settings', this)">⚙️ تنظیمات</div>
        </div>
        
        <div id="github" class="content active">
            <label>انتخاب ریپو:</label>
            <select id="repoList"><option>در حال بارگذاری...</option></select>
            <div>
                <button onclick="gitAction('clone')">⬇️ کلون</button>
                <button onclick="gitAction('pull')">🔄 Pull</button>
                <button onclick="gitAction('push')">⬆️ Push</button>
            </div>
            <div id="msgGithub" class="alert" style="display:none;"></div>
        </div>

        <div id="local" class="content">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <p id="currentPathLabel" style="color:#888;">مسیر فعلی: /sdcard</p>
                <button onclick="loadDirs('')" style="padding:5px 10px; font-size:12px;">🏠 بازگشت به روت</button>
            </div>
            <div class="folder-list" id="localDirsList"></div>
        </div>

        <div id="settings" class="content">
            <label>توکن گیت‌هاب:</label>
            <input type="password" id="tokenInput" placeholder="ghp_...">
            <button onclick="saveToken()">💾 ذخیره توکن</button>
            <div id="msgSettings" class="alert" style="display:none;"></div>
        </div>
    </div>

    <script>
        function openTab(tabName, el) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            el.classList.add('active');
            if(tabName === 'github') loadRepos();
            if(tabName === 'local') loadDirs('');
        }

        async function loadRepos() {
            const res = await fetch('/api/repos'); const data = await res.json();
            const select = document.getElementById('repoList');
            if(data.error) { select.innerHTML = `<option>${data.error}</option>`; return; }
            select.innerHTML = data.length ? data.map(r => `<option value="${r}">${r}</option>`).join('') : '<option>ریپویی یافت نشد</option>';
        }

        async function loadDirs(path) {
            const list = document.getElementById('localDirsList');
            list.innerHTML = 'در حال بارگذاری...';
            const res = await fetch(`/api/local_dirs?path=${encodeURIComponent(path)}`); 
            const data = await res.json();
            if(data.error) { list.innerHTML = `<div style="color:#cf6679">${data.error}</div>`; return; }
            
            document.getElementById('currentPathLabel').innerText = 'مسیر فعلی: ' + data.current_path;
            list.innerHTML = '';
            
            // دکمه بازگشت به پوشه والد
            if(data.current_path !== '/' && data.current_path !== '/sdcard') {
                let parts = data.current_path.split('/');
                parts.pop();
                let parentPath = parts.join('/') || '/';
                let upDiv = document.createElement('div');
                upDiv.className = 'folder-item';
                upDiv.innerHTML = '⬆️ .. (بازگشت به بالا)';
                upDiv.onclick = () => loadDirs(parentPath);
                list.appendChild(upDiv);
            }

            data.dirs.forEach(d => {
                let div = document.createElement('div');
                div.className = 'folder-item';
                div.innerHTML = '📁 ' + d.name;
                div.onclick = () => loadDirs(d.path);
                list.appendChild(div);
            });
        }

        async function gitAction(action) {
            const repo = document.getElementById('repoList').value;
            if(!repo || repo.includes('در حال') || repo.includes('یافت')) return;
            const msgBox = document.getElementById('msgGithub');
            msgBox.style.display = 'block'; msgBox.innerText = 'در حال پردازش...';
            const res = await fetch('/api/git', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({action: action, repo: repo}) });
            const data = await res.json();
            msgBox.innerText = data.msg || data.error;
            msgBox.className = data.error ? 'alert err' : 'alert';
        }

        async function saveToken() {
            const token = document.getElementById('tokenInput').value;
            const res = await fetch('/api/set_token', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({token: token}) });
            const data = await res.json();
            const msgBox = document.getElementById('msgSettings');
            msgBox.style.display = 'block'; msgBox.innerText = data.msg;
            loadRepos();
        }
        loadRepos();
    </script>
</body>
</html>
